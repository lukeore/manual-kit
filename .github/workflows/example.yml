# Self-test: build the example manual with headless Chrome and fail on any page overflow.
name: example

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Build example
        env:
          MANUAL_BROWSER: google-chrome
        run: python build_manual.py .example

      - name: Page previews
        if: always()
        run: |
          if ls .example/*.pdf >/dev/null 2>&1; then python preview.py .example --dpi 60; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-manual
          path: |
            .example/*.pdf
            .example/.cache/preview/*.png
          if-no-files-found: ignore
          include-hidden-files: true
